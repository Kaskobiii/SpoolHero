name: Publish fork Docker image

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: fork-docker-main
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  docker:
    if: github.repository == 'Kaskobiii/SpoolHero'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Check deployment scripts
        run: |
          bash -n scripts/*.sh
          python3 tests/docker_scripts_smoke.py
          python3 tests/updater_smoke.py
          bash tests/caddy_https_smoke.sh
          docker build -f deploy/updater/Dockerfile -t spoolhero-updater:ci .
          docker run --rm --entrypoint docker spoolhero-updater:ci compose version
      - name: Build test image
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: REVISION=${{ github.sha }}
          load: true
          tags: spoolhero:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Start disposable installation
        env:
          MYSQL_ROOT_PASSWORD: ci-only-disposable-password
          SPOOLHERO_IMAGE: spoolhero:ci
          SPOOLHERO_PORT: '5199'
        run: |
          docker compose -p spoolhero-ci pull db
          docker compose -p spoolhero-ci up -d --no-build --pull never --wait --wait-timeout 240
      - name: Create inventory fixture
        run: python3 tests/docker_persistence_smoke.py create http://127.0.0.1:5199 /tmp/spoolhero-fixture.json
      - name: Recreate app container
        env:
          MYSQL_ROOT_PASSWORD: ci-only-disposable-password
          SPOOLHERO_IMAGE: spoolhero:ci
          SPOOLHERO_PORT: '5199'
        run: docker compose -p spoolhero-ci up -d --no-build --pull never --no-deps --force-recreate --wait --wait-timeout 240 app
      - name: Verify saved inventory survived
        run: python3 tests/docker_persistence_smoke.py verify http://127.0.0.1:5199 /tmp/spoolhero-fixture.json
      - name: Container logs
        if: failure()
        env:
          MYSQL_ROOT_PASSWORD: ci-only-disposable-password
        run: docker compose -p spoolhero-ci logs --tail 150
      - name: Remove disposable installation
        if: always()
        env:
          MYSQL_ROOT_PASSWORD: ci-only-disposable-password
        run: docker compose -p spoolhero-ci down -v
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested source for Intel and ARM servers
        uses: docker/build-push-action@v6
        with:
          context: .
          build-args: REVISION=${{ github.sha }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/kaskobiii/spoolhero:latest
            ghcr.io/kaskobiii/spoolhero:sha-${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/Kaskobiii/SpoolHero
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
