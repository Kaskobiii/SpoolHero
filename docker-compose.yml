services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Create .env using scripts/install.sh first}
      MYSQL_DATABASE: SpoolManager
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_ROOT_PASSWORD" mysqladmin ping -h localhost --silent']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  app:
    image: ${SPOOLHERO_IMAGE:-ghcr.io/kaskobiii/spoolhero:latest}
    build: .
    restart: unless-stopped
    ports:
      - "${SPOOLHERO_PORT:-5000}:5000"
    environment:
      ConnectionStrings__Default: "Server=db;Port=3306;Database=SpoolManager;User=root;Password=${MYSQL_ROOT_PASSWORD:?Create .env using scripts/install.sh first};"
      ASPNETCORE_URLS: http://+:5000
      Updates__Url: http://updater:8091
      Updates__Token: ${SPOOLHERO_UPDATER_TOKEN:-}
    depends_on:
      db:
        condition: service_healthy

  updater:
    profiles: [maintenance]
    build:
      context: .
      dockerfile: deploy/updater/Dockerfile
    restart: unless-stopped
    environment:
      SPOOLHERO_INSTALL_DIR: ${SPOOLHERO_INSTALL_DIR:-/installation}
      SPOOLHERO_UPDATER_TOKEN: ${SPOOLHERO_UPDATER_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${SPOOLHERO_INSTALL_DIR:-.}:${SPOOLHERO_INSTALL_DIR:-/installation}

volumes:
  mysql_data:
