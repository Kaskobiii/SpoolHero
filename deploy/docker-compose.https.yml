services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "443:443"
      - "8081:8081"
    volumes:
      - ./local-https/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./local-https/public:/srv:ro
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
